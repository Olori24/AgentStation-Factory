name: AgentStation CI - Typecheck, Build, Tests & E2E Demo

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Build & pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build (vite + esbuild)
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run pytest suite
        run: python -m pytest -v tests/test_mission_sandbox.py tests/security_static_audit.py

  e2e-demo:
    name: End-to-end demo (fresh server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run demo end-to-end against a fresh server instance
        env:
          SANDBOX_RUNTIME: local
          TERMINAL_EXECUTION_ENABLED: 'true'
          DEMO_VERBOSE: '1'
        run: npm run demo
