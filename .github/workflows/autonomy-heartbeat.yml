name: AgentStation Autonomy Heartbeat

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: autonomy-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger autonomy worker
        env:
          AGENTSTATION_URL: ${{ secrets.AGENTSTATION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$AGENTSTATION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "AGENTSTATION_URL or CRON_SECRET is not configured; skipping external heartbeat ping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$AGENTSTATION_URL/api/autonomy/heartbeat" || {
              echo "Notice: Remote autonomy endpoint did not return 2xx; heartbeat skipped without failing check."
              exit 0
            }
