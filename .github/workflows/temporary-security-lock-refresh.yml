name: Temporary security lockfile refresh

on:
  push:
    branches:
      - security/audit-remediation-2026-11-07

permissions:
  contents: write

concurrency:
  group: security-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/audit-remediation-2026-11-07
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile from patched dependency constraints
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify clean production dependency audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): regenerate lockfile with patched dependencies"
          git push origin HEAD:security/audit-remediation-2026-11-07
