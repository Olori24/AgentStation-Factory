<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AgentStation Factory security boundary model</title>
<desc id="desc">Security layers from identity and authorization through tool controls, sandbox isolation, audit evidence and human approval.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="60" y="58" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">SECURITY BOUNDARY MODEL</text>
<text x="60" y="84" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">DEFENSE IN DEPTH • FAIL CLOSED • EVIDENCE FIRST</text>
<g font-family="Inter,Arial,sans-serif">
<g transform="translate(70 125)"><rect width="1060" height="310" rx="24" fill="#0b1220" stroke="#1e293b"/><rect x="18" y="18" width="1024" height="274" rx="20" fill="none" stroke="#334155"/><rect x="38" y="38" width="984" height="234" rx="18" fill="#0f172a" stroke="#475569"/><rect x="58" y="58" width="944" height="194" rx="16" fill="#111827" stroke="url(#edge)" stroke-width="2"/>
<text x="80" y="88" fill="#67e8f9" font-size="12" font-weight="700">IDENTITY + AUTHORIZATION</text><text x="80" y="110" fill="#cbd5e1" font-size="12">Signed sessions • RBAC • object access checks</text>
<text x="80" y="150" fill="#818cf8" font-size="12" font-weight="700">TOOL + INPUT CONTROLS</text><text x="80" y="172" fill="#cbd5e1" font-size="12">Path validation • SSRF defense • bounded payloads</text>
<text x="80" y="212" fill="#22d3ee" font-size="12" font-weight="700">EXECUTION ISOLATION</text><text x="80" y="234" fill="#cbd5e1" font-size="12">No-network sandbox • dropped capabilities • resource limits</text></g>
<g><rect x="90" y="465" width="230" height="30" rx="15" fill="#0f172a" stroke="#334155"/><text x="205" y="485" text-anchor="middle" fill="#94a3b8" font-size="11">AUDIT REDACTION</text><rect x="350" y="465" width="230" height="30" rx="15" fill="#0f172a" stroke="#334155"/><text x="465" y="485" text-anchor="middle" fill="#94a3b8" font-size="11">HUMAN APPROVAL</text><rect x="610" y="465" width="230" height="30" rx="15" fill="#0f172a" stroke="#334155"/><text x="725" y="485" text-anchor="middle" fill="#94a3b8" font-size="11">CSP + HEADERS</text><rect x="870" y="465" width="230" height="30" rx="15" fill="#0f172a" stroke="#334155"/><text x="985" y="485" text-anchor="middle" fill="#94a3b8" font-size="11">CI SECURITY GATES</text></g>
</g></svg>