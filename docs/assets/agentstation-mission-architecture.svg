" y="378" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">05</text><text x="408" y="412" fill="#f8fafc" font-size="17" font-weight="700">EXECUTION</text><text x="408" y="436" fill="#94a3b8" font-size="12">Sandbox / stream / artifacts</text></g><g><rect x="700" y="340" width="300" height="120" rx="18" fill="#0b1220" stroke="#1e293b"/><rect x="718" y="358" width="38" height="28" rx="8" fill="#111827" stroke="#334155"/><text x="737" y="378" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">06</text><text x="718" y="412" fill="#f8fafc" font-size="17" font-weight="700">VERIFICATION</text><text x="718" y="436" fill="#94a3b8" font-size="12">Tests / approval / evidence</text></g>
