<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentStation Factory — autonomous AI operations platform</title>
  <desc id="desc">A cinematic command-deck illustration showing mission intake, specialist agents, tools, verification and artifact delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".52" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern>
  </defs>
  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="718" rx="33" fill="url(#grid)" stroke="#334155"/>
  <circle cx="280" cy="130" r="190" fill="#06b6d4" opacity=".09" filter="url(#soft)"/>
  <circle cx="1300" cy="570" r="230" fill="#6366f1" opacity=".09" filter="url(#soft)"/>

  <text x="92" y="94" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">AGENTSTATION FACTORY</text>
  <text x="92" y="150" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="800">AI OPERATIONS,</text>
  <text x="92" y="210" fill="url(#cyan)" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="800">BUILT LIKE A COMMAND DECK.</text>
  <text x="92" y="252" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="20">Mission planning • specialist dispatch • controlled execution • verification • artifact delivery</text>

  <g transform="translate(92 314)">
    <rect width="1416" height="294" rx="24" fill="#020617" fill-opacity=".72" stroke="#1e293b"/>
    <rect x="26" y="26" width="1364" height="242" rx="18" fill="#0b1220" stroke="#334155"/>
    <text x="52" y="62" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">MISSION CONTROL PIPELINE</text>

    <g transform="translate(54 96)">
      <rect width="220" height="116" rx="16" fill="#0f172a" stroke="#22d3ee"/>
      <circle cx="30" cy="31" r="8" fill="#22d3ee" filter="url(#glow)"/>
      <text x="52" y="37" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">01 · OBJECTIVE</text>
      <text x="22" y="68" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Intent → mission</text>
      <text x="22" y="90" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Structured before execution</text>
    </g>
    <path d="M292 154H334" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)"/>

    <g transform="translate(344 96)">
      <rect width="220" height="116" rx="16" fill="#0f172a" stroke="#818cf8"/>
      <circle cx="30" cy="31" r="8" fill="#818cf8" filter="url(#glow)"/>
      <text x="52" y="37" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">02 · SQUAD</text>
      <text x="22" y="68" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Specialist dispatch</text>
      <text x="22" y="90" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Roles, tools, bounded scope</text>
    </g>
    <path d="M582 154H624" stroke="url(#violet)" stroke-width="3" filter="url(#glow)"/>

    <g transform="translate(634 96)">
      <rect width="220" height="116" rx="16" fill="#0f172a" stroke="#34d399"/>
      <circle cx="30" cy="31" r="8" fill="#34d399" filter="url(#glow)"/>
      <text x="52" y="37" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">03 · EXECUTE</text>
      <text x="22" y="68" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Tools + sandbox</text>
      <text x="22" y="90" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Audited and policy-gated</text>
    </g>
    <path d="M872 154H914" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>

    <g transform="translate(924 96)">
      <rect width="220" height="116" rx="16" fill="#0f172a" stroke="#fbbf24"/>
      <circle cx="30" cy="31" r="8" fill="#fbbf24" filter="url(#glow)"/>
      <text x="52" y="37" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">04 · VERIFY</text>
      <text x="22" y="68" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Tests + approvals</text>
      <text x="22" y="90" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Evidence before completion</text>
    </g>
    <path d="M1162 154H1204" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>

    <g transform="translate(1214 96)">
      <rect width="166" height="116" rx="16" fill="#0f172a" stroke="#22d3ee"/>
      <circle cx="30" cy="31" r="8" fill="#22d3ee" filter="url(#glow)"/>
      <text x="52" y="37" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">05 · SHIP</text>
      <text x="22" y="68" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Artifacts</text>
      <text x="22" y="90" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">Traceable outcomes</text>
    </g>
  </g>

  <text x="92" y="674" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">PRECISION • CONTROL • OBSERVABILITY • HUMAN OVERSIGHT</text>
  <text x="1508" y="674" text-anchor="end" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="13">© 2026 AGENTSTATION</text>
</svg>